[project]
name = "api"
version = "0.1.0"
description = "Denvia API — FastAPI 백엔드"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "authlib>=1.3",
    "celery[redis]>=5.6.3",
    "faiss-cpu>=1.13.2",
    "fastapi>=0.136.0",
    "httpx>=0.28.1",
    "langchain>=1.2.15",
    "langchain-community>=0.3.0",
    "langchain-openai>=1.1.16",
    "openai>=2.32.0",
    "psycopg[binary]>=3.3.3",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "pyjwt>=2.9",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.26",
    "python-ulid>=3.1.0",
    "redis>=6.4.0",
    "sentry-sdk[fastapi]>=2.58.0",
    "sse-starlette>=2.1.0",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.49",
    "structlog>=25.5.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.45.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.26.0",
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["..", "../vendor"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
