services:
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web.dev
    working_dir: /workspace
    command: >
      sh -c "corepack enable &&
      pnpm config set store-dir /pnpm/store &&
      pnpm install --frozen-lockfile &&
      cd /workspace/web && node_modules/.bin/next dev --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # 서버 사이드(Next.js generateMetadata 등)에서 백엔드 호출용 — compose 네트워크 내부 이름.
      API_INTERNAL_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - api
    volumes:
      # Dev: Windows/WSL/Claude/Codex/Docker all edit and run the same checkout.
      - ..:/workspace
      # Keep Linux dependency/build folders inside Docker volumes so Windows files do not mask them.
      - root_node_modules:/workspace/node_modules
      - web_node_modules:/workspace/web/node_modules
      - web_next:/workspace/web/.next
      - pnpm_store:/pnpm/store

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    working_dir: /workspace
    command: >
      sh -c "uv --project /workspace/api sync --frozen &&
      uv --project /workspace/api run alembic -c /workspace/api/alembic.ini upgrade head &&
      uv --project /workspace/api run python /workspace/api/scripts/seed_admin.py &&
      uv --project /workspace/api run python /workspace/api/scripts/seed_runtime_config.py &&
      uv --project /workspace/api run uvicorn api.src.main:app
      --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      # .env의 *_URL은 host-run 용도(localhost). 컨테이너에서는 compose 서비스명으로 덮어씀.
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql+psycopg://denvia:password@postgres:5432/denvia
      DATABASE_SYNC_URL: postgresql+psycopg://denvia:password@postgres:5432/denvia
      # vendor/rag(`from rag.run_qa import ...`) 임포트 가능하도록 명시
      # — 빌드된 이미지에 PYTHONPATH가 누락된 경우에도 안전.
      PYTHONPATH: /workspace:/workspace/vendor
      # RAG 인덱스 절대 경로 (uvicorn working dir이 /workspace라 상대경로 'data/faiss/current'는 못 찾음)
      # 세 변수 모두 필요. trigger_rebuild의 get_current_slot()이 index_a/index_b를
      # 상대경로(`data/faiss/index_a`)로 해석하면 CWD=/workspace 기준이라 절대 안 매칭되고,
      # 그 결과 target_slot이 항상 "a"로 떨어져 활성 슬롯 위에 덮어쓰기 → 심볼릭 변화 없음
      # → query_runner의 realpath 비교가 "같음"으로 판단 → 리로드 스킵.
      FAISS_CURRENT_PATH: /workspace/api/data/faiss/current
      FAISS_INDEX_A_PATH: /workspace/api/data/faiss/index_a
      FAISS_INDEX_B_PATH: /workspace/api/data/faiss/index_b
      WATCHFILES_FORCE_POLLING: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Dev: bind the entire checkout so api/, vendor/, scripts, and docs paths stay identical.
      - ..:/workspace
      # 호스트의 Windows .venv가 컨테이너 Linux .venv를 덮어쓰지 못하게 named volume으로 분리
      - api_venv:/workspace/api/.venv

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    working_dir: /workspace
    command: >
      sh -c "uv --project /workspace/api sync --frozen &&
      uv --project /workspace/api run celery -A api.src.workers.celery_app worker --loglevel=info"
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql+psycopg://denvia:password@postgres:5432/denvia
      DATABASE_SYNC_URL: postgresql+psycopg://denvia:password@postgres:5432/denvia
      PYTHONPATH: /workspace:/workspace/vendor
      FAISS_CURRENT_PATH: /workspace/api/data/faiss/current
      FAISS_INDEX_A_PATH: /workspace/api/data/faiss/index_a
      FAISS_INDEX_B_PATH: /workspace/api/data/faiss/index_b
    depends_on:
      - redis
      - postgres
    volumes:
      - ..:/workspace
      - worker_venv:/workspace/api/.venv

  beat:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    working_dir: /workspace
    command: >
      sh -c "uv --project /workspace/api sync --frozen &&
      uv --project /workspace/api run celery -A api.src.workers.celery_app beat --loglevel=info"
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql+psycopg://denvia:password@postgres:5432/denvia
      DATABASE_SYNC_URL: postgresql+psycopg://denvia:password@postgres:5432/denvia
      PYTHONPATH: /workspace:/workspace/vendor
      FAISS_CURRENT_PATH: /workspace/api/data/faiss/current
      FAISS_INDEX_A_PATH: /workspace/api/data/faiss/index_a
      FAISS_INDEX_B_PATH: /workspace/api/data/faiss/index_b
    depends_on:
      - redis
    volumes:
      - ..:/workspace
      - beat_venv:/workspace/api/.venv

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: denvia
      POSTGRES_PASSWORD: password
      POSTGRES_DB: denvia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U denvia"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/empty.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/denvia.conf:/etc/nginx/conf.d/denvia.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  redis_data:
  api_venv:
  worker_venv:
  beat_venv:
  root_node_modules:
  web_node_modules:
  web_next:
  pnpm_store:
