# CI 경량 환경 — postgres + redis만 구동
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: denvia
      POSTGRES_PASSWORD: password
      POSTGRES_DB: denvia
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U denvia"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
