# upstream 정의
upstream web_upstream {
    server web:3000;
}

upstream api_upstream {
    server api:8000;
}

server {
    listen 80 default_server;
    server_name denvia.ai.kr www.denvia.ai.kr;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name denvia.ai.kr www.denvia.ai.kr;

    ssl_certificate /etc/letsencrypt/live/denvia.ai.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/denvia.ai.kr/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    include /etc/nginx/snippets/security-headers.conf;

    # Next.js 프론트엔드
    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI 백엔드
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 백엔드 정적 자산 — 팝업/CS답변/문의/게시판 본문 이미지
    # Why: 에디터가 저장한 이미지 src가 `https://denvia.ai.kr/static/...` 로 박혀
    # 브라우저에서 직접 요청됨. 이 location 이 없으면 `/` 폴백으로 Next.js 가 받아 404.
    location /static/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # FastAPI 헬스체크
    location = /healthz {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /readyz {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE 스트리밍 엔드포인트 (Q&A 스트림)
    location /api/v1/qa/stream {
        proxy_pass http://api_upstream;
        include /etc/nginx/snippets/sse-proxy.conf;
    }

    # SSE 스트리밍 엔드포인트 (관리자 이벤트)
    location /api/v1/admin/events {
        proxy_pass http://api_upstream;
        include /etc/nginx/snippets/sse-proxy.conf;
    }
}
