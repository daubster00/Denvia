services:
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      # NEXT_PUBLIC_* 는 빌드 시점에 번들에 박힘. .env.production 값이 여기로 흘러감.
      # 배포 명령에 `--env-file ../.env.production` 플래그 필요.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://denvia.ai.kr}
        NEXT_PUBLIC_TOSS_CLIENT_KEY: ${NEXT_PUBLIC_TOSS_CLIENT_KEY}
        NEXT_PUBLIC_KAKAO_CHANNEL_URL: ${NEXT_PUBLIC_KAKAO_CHANNEL_URL}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    # --proxy-headers / --forwarded-allow-ips (2026-11-04)
    #   이 옵션이 없으면 `request.client.host` 가 **nginx 컨테이너의 내부 IP**
    #   (172.18.0.x) 로 고정된다. nginx 는 실제 접속자 IP 를 X-Forwarded-For 로
    #   정상 전달하는데(infra/nginx/denvia.prod.conf), uvicorn 이 그 헤더를 안 읽어서
    #   로그인 실패·복구요청 남용 같은 **이상탐지의 IP 기록이 전부 같은 값**이 됐다
    #   (anomaly_events.ip / auth.login.brute_force.* / auth.password_reset 등).
    #   IP 기반 탐지·차단이 사실상 무력화된 상태였다.
    #   컨테이너는 nginx 뒤에만 노출되고 외부 포트가 없으므로 '*' 신뢰가 안전하다.
    command: uv --project /workspace/api run uvicorn api.src.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    env_file:
      - ../.env.production
    environment:
      # vendor/rag(`from rag.run_qa import ...`) 임포트 안전망 — 이미지 빌드 시 ENV가 누락된 적 있음.
      - PYTHONPATH=/workspace:/workspace/vendor
      # RAG 인덱스 절대 경로
      - FAISS_CURRENT_PATH=/workspace/api/data/faiss/current
      - FAISS_INDEX_A_PATH=/workspace/api/data/faiss/index_a
      - FAISS_INDEX_B_PATH=/workspace/api/data/faiss/index_b
    volumes:
      - api_data:/workspace/api/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    command: uv --project /workspace/api run celery -A api.src.workers.celery_app worker --loglevel=info
    env_file:
      - ../.env.production
    environment:
      - PYTHONPATH=/workspace:/workspace/vendor
      - FAISS_CURRENT_PATH=/workspace/api/data/faiss/current
      - FAISS_INDEX_A_PATH=/workspace/api/data/faiss/index_a
      - FAISS_INDEX_B_PATH=/workspace/api/data/faiss/index_b
    volumes:
      - api_data:/workspace/api/data
    depends_on:
      - redis
      - postgres

  beat:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    command: uv --project /workspace/api run celery -A api.src.workers.celery_app beat --loglevel=info
    env_file:
      - ../.env.production
    environment:
      - PYTHONPATH=/workspace:/workspace/vendor
      - FAISS_CURRENT_PATH=/workspace/api/data/faiss/current
      - FAISS_INDEX_A_PATH=/workspace/api/data/faiss/index_a
      - FAISS_INDEX_B_PATH=/workspace/api/data/faiss/index_b
    volumes:
      - api_data:/workspace/api/data
    depends_on:
      - redis

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      # POSTGRES_PASSWORD 는 env_file 에서 주입됨.
      POSTGRES_USER: denvia
      POSTGRES_DB: denvia
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U denvia"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/denvia.prod.conf:/etc/nginx/conf.d/denvia.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  redis_data:
  certbot_www:
  api_data:
